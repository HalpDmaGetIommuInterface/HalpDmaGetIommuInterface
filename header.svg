<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180">
  <defs>
    <!-- Glitch displacement filters -->
    <filter id="glitch-red" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceGraphic" dx="-3" dy="1" result="offset" />
    </filter>
    <filter id="glitch-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceGraphic" dx="3" dy="-1" result="offset" />
    </filter>

    <style>
      .bg { fill: #000000; }
      
      .brand {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Arial", sans-serif;
        font-size: 76px;
        font-weight: 900;
        letter-spacing: -0.05em;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .cyan-layer {
        fill: #00f0ff;
        opacity: 0.85;
        animation: glitch-anim-cyan 2.8s infinite steps(2, start);
      }

      .red-layer {
        fill: #ff3b30;
        opacity: 0.85;
        animation: glitch-anim-red 2.8s infinite steps(2, start);
      }

      .main-layer {
        fill: #ffffff;
      }

      .subtext {
        font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.16em;
        fill: #888888;
        text-anchor: middle;
      }

      .red-accent {
        fill: #ff3b30;
      }

      .glow-dot {
        fill: #ff3b30;
        animation: pulse 1.8s infinite ease-in-out;
      }

      @keyframes glitch-anim-red {
        0%, 92%, 100% { transform: translate(0, 0); opacity: 0; }
        93% { transform: translate(-4px, 2px); opacity: 0.9; }
        95% { transform: translate(3px, -1px); opacity: 0.7; }
        97% { transform: translate(-2px, 3px); opacity: 0.9; }
      }

      @keyframes glitch-anim-cyan {
        0%, 91%, 100% { transform: translate(0, 0); opacity: 0; }
        92% { transform: translate(4px, -2px); opacity: 0.9; }
        94% { transform: translate(-3px, 1px); opacity: 0.7; }
        96% { transform: translate(2px, -3px); opacity: 0.9; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; r: 3; }
        50% { opacity: 1; r: 4.5; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Chromatic layers -->
  <g transform="translate(425, 75)">
    <text class="brand cyan-layer">dragon</text>
    <text class="brand red-layer">dragon</text>
    <text class="brand main-layer">dragon</text>
  </g>

  <!-- Live Pulse Beacon -->
  <circle cx="280" cy="142" class="glow-dot" />

  <!-- Subtitle Bar with Color -->
  <text x="435" y="146" class="subtext">
    <tspan class="red-accent">RING 0 AND BELOW</tspan>
    <tspan fill="#333333"> // </tspan>
    <tspan fill="#00f0ff">FROM UNDER THE HYPERVISOR</tspan>
  </text>
</svg>
